name: Docker images

on:
  # Rebuild when the image definition changes
  push:
    branches: [main]
    paths:
      - docker/Dockerfile
      - docker/docker-entrypoint.sh
      - .github/workflows/docker-images.yml
  # Monthly rebuild to pick up Ubuntu security updates
  schedule:
    - cron: "0 6 1 * *"
  # Manual rebuild from the Actions tab
  workflow_dispatch:

concurrency:
  group: docker-images
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/asuswrt-merlin/fw-build

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One at a time, to avoid concurrent pushes to the same package
      max-parallel: 1
      matrix:
        ubuntu: ["20.04", "22.04"]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu }}
          tags: ${{ env.IMAGE }}:${{ matrix.ubuntu }}
          platforms: linux/amd64
          # Always start fresh, so package updates are picked up
          pull: true
          no-cache: true
          # Push a plain image (no attestation manifests), so that
          # superseded images are the only untagged versions in the package
          provenance: false
          sbom: false
          push: true

  cleanup:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Remove superseded images, keeping a few recent ones
      - uses: actions/delete-package-versions@v5
        with:
          package-name: fw-build
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 4
